name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      BEESWAX_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Restore vendored ONNX Runtime and voice models
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            runtime
            models
          key: beeswax-vendor-v1-${{ hashFiles('models.json', 'scripts/vendor.py') }}
      - name: Vendor ONNX Runtime and voice models
        run: python scripts/vendor.py
      - name: Save vendored ONNX Runtime and voice models
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            runtime
            models
          key: beeswax-vendor-v1-${{ hashFiles('models.json', 'scripts/vendor.py') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Smoke-test the vendored runtime and models
        run: |
          .\target\release\beeswax.exe --providers
          .\target\release\beeswax.exe --self-test
      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $manifest = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersion = $manifest.packages[0].version
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -ne $packageVersion) {
            throw "Tag v$tagVersion does not match Cargo.toml version $packageVersion."
          }
      - name: Package Windows app
        run: python scripts/vendor.py package
      - uses: actions/upload-artifact@v4
        with:
          name: beeswax-windows-x64
          path: target/beeswax-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beeswax-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: beeswax-windows-x64.zip
