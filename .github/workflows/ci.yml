name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      BEESWAX_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $manifest = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersion = $manifest.packages[0].version
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -ne $packageVersion) {
            throw "Tag v$tagVersion does not match Cargo.toml version $packageVersion."
          }
      - name: Package Windows app
        shell: pwsh
        run: >-
          Compress-Archive -Force -Path target/release/beeswax.exe, LICENSE,
          scripts/setup-runtime.ps1, scripts/setup-cuda-runtime.ps1,
          scripts/fetch-model.ps1, README.md -DestinationPath target/beeswax-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: beeswax-windows-x64
          path: target/beeswax-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beeswax-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: beeswax-windows-x64.zip
